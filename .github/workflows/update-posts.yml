name: 티스토리 최근 글 갱신

on:
  schedule:
    # 하루 두 번 (한국시간 오전 9시 7분, 오후 9시 7분)
    - cron: "7 0,12 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS 읽어서 posts.json 만들기
        run: python scripts/fetch_tistory.py

      - name: 변경 사항이 있으면 커밋
        run: |
          if git diff --quiet -- posts.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "티스토리 최근 글 갱신"
          git push
